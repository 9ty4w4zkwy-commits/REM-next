          path = Path("content/books/catalog.json")
          catalog = json.loads(path.read_text())
          book = next(book for book in catalog["books"] if book["id"] == "montecristo")
          assert [c["id"] for c in book["chapters"]] == [f"capitolo-{n:02}" for n in range(1,21)]
          assert set(expected) == {entry["id"] + ".words.json" for entry in chapters}
          for entry in chapters:
              name = entry["id"] + ".words.json"
              source = Path("release-maps") / name
              assert sha256(source.read_bytes()).hexdigest() == expected[name], name
              assert (Path("content/books/montecristo") / entry["file"]).is_file(), entry
              dest = Path("audio/montecristo") / name
              assert not dest.exists(), dest
              dest.write_bytes(source.read_bytes())
          book["chapters"].extend(chapters)
          path.write_text(json.dumps(catalog, ensure_ascii=False, indent=2) + "\n")
          PYTHON
      - run: npm test
      - name: Stage release commit
        run: |
          git add content/books/catalog.json audio/montecristo/capitolo-{21..49}.words.json
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish synchronized Montecristo chapters 21–49"
          git push origin HEAD:refs/heads/montecristo-chapters-21-49
