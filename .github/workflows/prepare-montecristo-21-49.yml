name: Prepare Montecristo chapters 21–49
on:
  push:
    branches: [readflow-montecristo-21-49]
    paths: [.github/workflows/prepare-montecristo-21-49.yml]
permissions:
  actions: read
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 90763b042a0fe762883088b6774b8203c3d11df3
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download verified maps
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 45975582769 --name montecristo-readflow-21-49-verified --dir release-maps
      - name: Assemble chapter catalog and word maps
        run: |
          python - <<'PYTHON'
