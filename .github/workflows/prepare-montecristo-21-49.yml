          from pathlib import Path
          import json
          chapters = [{'id': 'capitolo-21', 'title': 'Capitolo 21 · L’isola di Tiboulen', 'file': 'capitolo-21.txt', 'audioSource': 'r2'}, {'id': 'capitolo-22', 'title': 'Capitolo 22 · I contrabbandieri', 'file': 'capitolo-22.txt', 'audioSource': 'r2'}, {'id': 'capitolo-23', 'title': 'Capitolo 23 · L’isola di Montecristo', 'file': 'capitolo-23.txt', 'audioSource': 'r2'}, {'id': 'capitolo-24', 'title': 'Capitolo 24 · L’abbagliamento', 'file': 'capitolo-24.txt', 'audioSource': 'r2'}, {'id': 'capitolo-25', 'title': 'Capitolo 25 · Lo sconosciuto', 'file': 'capitolo-25.txt', 'audioSource': 'r2'}, {'id': 'capitolo-26', 'title': 'Capitolo 26 · La locanda del Ponte di Gard', 'file': 'capitolo-26.txt', 'audioSource': 'r2'}, {'id': 'capitolo-27', 'title': 'Capitolo 27 · Il racconto', 'file': 'capitolo-27.txt', 'audioSource': 'r2'}, {'id': 'capitolo-28', 'title': 'Capitolo 28 · I registri delle prigioni', 'file': 'capitolo-28.txt', 'audioSource': 'r2'}, {'id': 'capitolo-29', 'title': 'Capitolo 29 · La casa Morrel', 'file': 'capitolo-29.txt', 'audioSource': 'r2'}, {'id': 'capitolo-30', 'title': 'Capitolo 30 · Il 5 settembre', 'file': 'capitolo-30.txt', 'audioSource': 'r2'}, {'id': 'capitolo-31', 'title': 'Capitolo 31 · Italia — Sindbad il marinaio', 'file': 'capitolo-31.txt', 'audioSource': 'r2'}, {'id': 'capitolo-32', 'title': 'Capitolo 32 · Il risveglio', 'file': 'capitolo-32.txt', 'audioSource': 'r2'}, {'id': 'capitolo-33', 'title': 'Capitolo 33 · I briganti', 'file': 'capitolo-33.txt', 'audioSource': 'r2'}, {'id': 'capitolo-34', 'title': 'Capitolo 34 · Le apparizioni', 'file': 'capitolo-34.txt', 'audioSource': 'r2'}, {'id': 'capitolo-35', 'title': 'Capitolo 35 · Il patibolo', 'file': 'capitolo-35.txt', 'audioSource': 'r2'}, {'id': 'capitolo-36', 'title': 'Capitolo 36 · Il carnevale di Roma', 'file': 'capitolo-36.txt', 'audioSource': 'r2'}, {'id': 'capitolo-37', 'title': 'Capitolo 37 · Le catacombe di San Sebastiano', 'file': 'capitolo-37.txt', 'audioSource': 'r2'}, {'id': 'capitolo-38', 'title': 'Capitolo 38 · L’appuntamento', 'file': 'capitolo-38.txt', 'audioSource': 'r2'}, {'id': 'capitolo-39', 'title': 'Capitolo 39 · La colazione', 'file': 'capitolo-39.txt', 'audioSource': 'r2'}, {'id': 'capitolo-40', 'title': 'Capitolo 40 · La presentazione', 'file': 'capitolo-40.txt', 'audioSource': 'r2'}, {'id': 'capitolo-41', 'title': 'Capitolo 41 · Bertuccio', 'file': 'capitolo-41.txt', 'audioSource': 'r2'}, {'id': 'capitolo-42', 'title': 'Capitolo 42 · La casa d’Auteuil', 'file': 'capitolo-42.txt', 'audioSource': 'r2'}, {'id': 'capitolo-43', 'title': 'Capitolo 43 · La vendetta', 'file': 'capitolo-43.txt', 'audioSource': 'r2'}, {'id': 'capitolo-44', 'title': 'Capitolo 44 · La pioggia di sangue', 'file': 'capitolo-44.txt', 'audioSource': 'r2'}, {'id': 'capitolo-45', 'title': 'Capitolo 45 · Il credito illimitato', 'file': 'capitolo-45.txt', 'audioSource': 'r2'}, {'id': 'capitolo-46', 'title': 'Capitolo 46 · La pariglia grigio pomellata', 'file': 'capitolo-46.txt', 'audioSource': 'r2'}, {'id': 'capitolo-47', 'title': 'Capitolo 47 · Ideologia', 'file': 'capitolo-47.txt', 'audioSource': 'r2'}, {'id': 'capitolo-48', 'title': 'Capitolo 48 · Haydée', 'file': 'capitolo-48.txt', 'audioSource': 'r2'}, {'id': 'capitolo-49', 'title': 'Capitolo 49 · La famiglia Morrel', 'file': 'capitolo-49.txt', 'audioSource': 'r2'}]
