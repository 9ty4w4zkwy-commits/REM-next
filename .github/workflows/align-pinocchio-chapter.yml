name: Align Pinocchio chapter word timeline
on:
  workflow_dispatch:
    inputs:
      chapter:
        description: 'Chapter number (1–36); matching M4A must already be in audio/pinocchio/'
        required: true
        type: number
permissions:
  contents: write
jobs:
  align:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install openai-whisper beautifulsoup4
      - name: Align selected chapter
        run: python scripts/align_pinocchio.py --chapter "${{ inputs.chapter }}"
      - name: Commit timeline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/pinocchio/*.words.json
          git diff --cached --quiet || (git commit -m "Generate Pinocchio word timeline" && git push)
